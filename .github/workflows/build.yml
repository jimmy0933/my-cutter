name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign libandroid-23-java android-sdk-build-tools dalvik-exchange

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/release.keystore"
            echo "KEYSTORE=$HOME/.android/release.keystore" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with a throwaway debug key"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-cutter-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: my-cutter v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk

      - name: Delete older releases and tags (keep only this one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="v${VERSION_NAME}"
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "$keep" ]; then
              echo "Deleting release $tag"
              gh release delete "$tag" --cleanup-tag --yes || true
            fi
          done
